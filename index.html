<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#183A2A"
    >

    <title>HuntMark — Hunt Smarter. Know Your Land.</title>

    <!-- HuntMark stylesheet will be added next -->
    <link rel="stylesheet" href="css/main.css">
</head>

<body>

    <!-- =========================
         HUNTMARK HEADER
    ========================== -->

    <header class="topbar">

        <div class="brand">

            <div class="brand-mark">
                ♢
            </div>

            <div class="brand-text">

                <h1>
                    HUNT<span>MARK</span>
                </h1>

                <p>
                    Hunt smarter. Know your land.
                </p>

            </div>

        </div>


        <!-- Main navigation -->

        <nav class="main-nav">

            <button class="nav-button active">
                🗺️ Map
            </button>

            <button class="nav-button">
                🌲 Property
            </button>

            <button class="nav-button">
                🌤️ Weather
            </button>

            <button class="nav-button">
                📊 Reports
            </button>

        </nav>


        <!-- Mobile menu -->

        <button
            class="mobile-menu"
            aria-label="Open menu"
        >
            ☰
        </button>

    </header>


    <!-- =========================
         MAIN APPLICATION
    ========================== -->

    <main class="app">

        <!-- Map will be added here -->

        <section
            id="map"
            class="map-container"
        >

            <div class="map-placeholder">

                <div class="map-placeholder-content">

                    <div class="map-icon">
                        🗺️
                    </div>

                    <h2>
                        HuntMark Map
                    </h2>

                    <p>
                        Your hunting property map will appear here.
                    </p>

                </div>

            </div>

        </section>


        <!-- =========================
             MAP TOOLBAR
        ========================== -->

        <aside class="map-tools">

            <button
                class="map-tool"
                id="standTool"
            >
                <span>🦌</span>
                <small>Stands</small>
            </button>


            <button
                class="map-tool"
                id="cameraTool"
            >
                <span>📷</span>
                <small>Cameras</small>
            </button>


            <button
                class="map-tool"
                id="foodTool"
            >
                <span>🌱</span>
                <small>Food</small>
            </button>


            <button
                class="map-tool"
                id="waterTool"
            >
                <span>💧</span>
                <small>Water</small>
            </button>


            <button
                class="map-tool"
                id="trailTool"
            >
                <span>🥾</span>
                <small>Trails</small>
            </button>


            <button
                class="map-tool"
                id="boundaryTool"
            >
                <span>⬚</span>
                <small>Boundary</small>
            </button>

        </aside>


        <!-- =========================
             PROPERTY PANEL
        ========================== -->

        <aside class="property-panel">

            <div class="panel-section">

                <h2>
                    My Property
                </h2>

                <p class="panel-subtitle">
                    Start planning your hunting property.
                </p>

            </div>


            <div class="panel-section">

                <button class="primary-action">
                    🦌 Add Stand
                </button>

                <button class="secondary-action">
                    🌱 Add Food Plot
                </button>

                <button class="secondary-action">
                    📷 Add Trail Camera
                </button>

                <button class="secondary-action">
                    💧 Add Water
                </button>

                <button class="secondary-action">
                    ⬚ Draw Property Boundary
                </button>

            </div>


            <!-- Property statistics -->

            <div class="panel-section">

                <h3>
                    Property Activity
                </h3>

                <div class="property-stats">

                    <div class="stat">
                        <strong id="standCount">0</strong>
                        <span>Stands</span>
                    </div>

                    <div class="stat">
                        <strong id="cameraCount">0</strong>
                        <span>Cameras</span>
                    </div>

                    <div class="stat">
                        <strong id="foodCount">0</strong>
                        <span>Food Plots</span>
                    </div>

                    <div class="stat">
                        <strong id="waterCount">0</strong>
                        <span>Water</span>
                    </div>

                </div>

            </div>

        </aside>


        <!-- =========================
             MAP CONTROLS
        ========================== -->

        <div class="map-controls">

            <button id="locationButton">
                ◎ My Location
            </button>

            <button id="satelliteButton">
                🛰️ Satellite
            </button>

        </div>


    </main>


    <!-- JavaScript will be added later -->
    <script src="js/app.js"></script>

</body>
</html>
